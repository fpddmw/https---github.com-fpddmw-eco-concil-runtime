interface:
  display_name: "Eco Open Falsification Probe"
  short_description: "Open compact falsification probes from the next-action queue"
  default_prompt: "Use $open-falsification-probe to convert contradiction-heavy or low-confidence next actions into explicit falsification probes with target ids, evidence refs, and governance follow-up actions. A probe is a test target, not proof a claim is false, and it does not select professional analysis tools for the council."
