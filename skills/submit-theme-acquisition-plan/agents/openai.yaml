name: submit-theme-acquisition-plan
description: Submit an investigator-authored or adopted theme acquisition plan.
default_prompt: >
  Use $submit-theme-acquisition-plan when you own or explicitly adopt an
  investigation theme obligation. State evidence obligations, success criteria,
  denominator obligations, recovery choices, and downgrade boundaries. Do not
  state source families, source skills, query variants, query parameters, or
  route rankings in this plan.
