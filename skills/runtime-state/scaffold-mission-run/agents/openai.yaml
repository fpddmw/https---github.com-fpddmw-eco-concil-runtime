interface:
  display_name: "Eco Scaffold Mission Run"
  short_description: "Materialize mission, round tasks, and seeded board state for a new run"
  default_prompt: "Use $scaffold-mission-run to scaffold mission.json, first-round task inputs, and initial board hypotheses from one user-facing mission envelope. Treat mission fields and seeded hypotheses/source requests as starting context only, not a moderator plan, evidence acceptance, source selection, or hard agenda; missing scope means scoping is needed, not that evidence is absent."
