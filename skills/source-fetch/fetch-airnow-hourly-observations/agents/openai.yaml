interface:
  display_name: "AirNow Hourly Obs Fetch"
  short_description: "Fetch AirNow hourly AQ observations"
  default_prompt: "Use $fetch-airnow-hourly-observations to fetch preliminary AirNow station observations for an explicit UTC window, bbox, and pollutant list. Always pass negative-longitude bboxes as --bbox=<min_lon,min_lat,max_lon,max_lat> so argparse does not treat the value as an option. AirNow supports receptor-side environmental chronology/local conditions only; do not use it as official-action evidence. Empty or sparse rows can reflect monitor coverage, parameters, file timing, or bbox limits; do not treat them as absence of an air-quality episode without follow-up."
