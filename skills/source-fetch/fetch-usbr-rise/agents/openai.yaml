interface:
  display_name: "USBR RISE Fetch"
  short_description: "Discover RISE item IDs and fetch explicit operational time-series rows"
  default_prompt: "Use $fetch-usbr-rise discover-items when the evidence need names a USBR place/parameter but no RISE item ID is grounded yet; cite the discovery artifact before proposing a bounded result fetch. Use fetch only with explicit RISE item IDs and bounded windows. Zero or sparse rows require item/filter review and are not proof of absence; do not infer shortage severity, compliance, governance responsibility, or report conclusions."
