interface:
  display_name: "GDELT DOC Search"
  short_description: "Search GDELT DOC API with retries and logs"
  default_prompt: "Use $fetch-gdelt-doc-search to run atomic GDELT DOC article/timeline reconnaissance or DOC-level media tone queries. First run lint-query for agent-authored boolean/domain queries. Wrap every OR group in parentheses, for example --query '(smoke OR advisory OR alert) \"New York City\"'; never submit smoke OR advisory without parentheses. Use --domain-is for exact domains, never site:. DOC supports artlist, timelinetone, tonechart, tone/toneabs operators, and tone sorting; DOC tone is media/document tone, not public sentiment. DOC results are query-sensitive and separate from Events/Mentions/GKG exports; zero DOC rows or exact-domain misses are not evidence that public or official records are absent. If an exact official-domain route returns zero while the evidence need remains live, revise/lower domain restrictions or use same-family Events/Mentions/GKG or another official-record surface before filing absence or completeness claims."
