interface:
  display_name: "Federal Register Documents Fetch"
  short_description: "Fetch official FederalRegister.gov document metadata"
  default_prompt: "Use $fetch-federal-register-documents to fetch official FederalRegister.gov document metadata by term, agency, type, and publication date only when the evidence question is federal publication/rulemaking/notice metadata. Do not use it as the default route for local NYC advisories, school closures, transit alerts, or health guidance. Zero rows or broad federal-rule matches require route-fit review and are not proof of absence; do not derive legal meaning, source sufficiency, or report conclusions."
