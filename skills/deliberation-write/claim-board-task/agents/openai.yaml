interface:
  display_name: "Eco Claim Board Task"
  short_description: "Claim or upsert a board follow-up task"
  default_prompt: "Use $claim-board-task to claim or upsert a follow-up task on the current round's board state. Treat the task as procedural accountability only: it does not prove a claim or decide evidence sufficiency. Preserve task ownership, source ids, linked evidence refs, and any unresolved limits for downstream findings, dispositions, readiness opinions, or synthesis."
