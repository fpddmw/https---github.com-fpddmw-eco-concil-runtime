interface:
  display_name: "Eco Summarize Board State"
  short_description: "Summarize a round's board state into a compact JSON snapshot"
  default_prompt: "Use $summarize-board-state to summarize the current round's board state into a compact visibility snapshot with active counts, recent events, and next-step hints. Treat the snapshot as organization context only, not readiness, evidence ranking, agenda lock, or proof that absent items have no evidence."
