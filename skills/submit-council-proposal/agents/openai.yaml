interface:
  display_name: "Submit Council Proposal"
  short_description: "Write one structured council proposal into the deliberation DB"
  default_prompt: "Use $submit-council-proposal only after the supporting finding, evidence bundle, review object, or challenge disposition exists. Treat confidence as the author's posture, not source rank or evidence weight. Always provide explicit proposal_kind, agent_role, rationale, target anchors, at least one evidence_ref, response_to_id or lineage_id pointing to the basis, provenance_json, and any limitations or report-basis judgement fields instead of hiding them in board notes."
